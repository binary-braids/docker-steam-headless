# Optionally launch directly to steam big picture (disabled by default)
[program:steam]
priority=50
autostart=false
autorestart=true
# Retry a restart a few times.
# This allows this container to start up before X is ready.
startretries=50
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
# Use the absolute path provided by the .deb package
command=/usr/games/steam %(ENV_STEAM_ARGS)s
# Added XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS to ensure the .deb client 
# communicates correctly with the container's X server and audio layers.
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="/tmp/.X11-unix/run",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/dbus-session"
stopsignal=INT
# Ensure the logs point to the user's home where we have write permissions
stdout_logfile=/home/%(ENV_USER)s/.cache/log/steam.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/steam.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7